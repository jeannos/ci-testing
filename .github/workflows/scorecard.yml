# OpenSSF Scorecard: a score of the security practices of the repository (branch protection,
# pinned dependencies, token permissions, ...), published for the badge of the README.
# The layout is the one Scorecard asks for when it publishes the results: these actions only.
name: scorecard

on:
  branch_protection_rule:
  push:
    branches: [master, main]
  schedule:
    - cron: "23 6 * * 3"

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
